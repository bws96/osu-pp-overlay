name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest -q test_distribution.py test_live_service.py test_local_scores.py test_core.py
      - run: node test_counter.cjs
      - run: node test_live_counter.cjs
