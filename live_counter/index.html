<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>플레이 예상치</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;pointer-events:none}
#live{visibility:hidden;color:white;font:600 32px/1.3 "Segoe UI","Malgun Gothic",sans-serif;text-shadow:0 1px 3px #000,0 0 5px #000;padding:0 3px}#live[data-visible="true"]{visibility:visible}
.line{display:flex;align-items:baseline;justify-content:space-between;gap:6px}.label{font-size:.68em;color:#d7e7f5;white-space:nowrap}.value{font-variant-numeric:tabular-nums}.forecast .value{color:#a7f2d1}
</style></head><body><div id="live"><div class="line"><span class="label">현재</span><span class="value" id="current">—</span></div><div class="line forecast" title="현재 정확도 유지, 앞으로 추가 미스·콤보 끊김 없이 완주할 경우"><span class="label">완주 예상</span><span class="value" id="forecast">—</span></div></div>
<script src="logic.js?v=4"></script><script src="display.js?v=4"></script></body></html>
